# ghworldtour_functions.toml - Manual corrections for the analyzer (default.xex).
#
# Add functions the analyzer missed, [[switch_tables]] it mistranslates and
# [[midasm_hook]]s into src/.

# The C runtime's setjmp and longjmp (sub_8251FBC0 saves f14-f31, r13-r31, v64-v127, r1, LR and CR in the jmp_buf;
# sub_8251F560 unwinds to it and loads them back), the same code as in KameoRecomp. The codegen turns calls to them
# into the host's setjmp and longjmp, keyed by the guest jmp_buf; translated as plain functions, longjmp would load
# the registers and return to its caller instead of jumping. Only the image decoders use them: libjpeg
# (sub_821D2748: setjmp at its error manager + 144, where its error function sub_821D1800 longjmps back) and libpng
# (sub_821D2970, sub_821E6250: setjmp at the start of the png struct, longjmp from sub_821E44D0 and sub_821D18C8).
setjmp_address = 0x8251FBC0
longjmp_address = 0x8251F560

# Codegen: the registers no call passes on are local variables of each function, not fields of the PPCContext, so
# the compiler keeps them in host registers and the __savegprlr/__restgprlr helpers are elided, as in KameoRecomp,
# GRAWRecomp and POTCAWERecomp. non_argument_as_local (r0, r2, r11, r12) stays off: the SEH funclets read r12, which
# the SDK does not pass them. The non-volatile vector registers stay in the context (SDK change 42): this game's
# compiler passes values to its callees in them, outside the calling convention. sub_82686990, sub_82688508 and
# sub_8268A8B8 set v92 (vor128 v92,v12,v12) and call sub_826862F0, whose callees sub_8268E790, sub_8268EA70,
# sub_8268EEC8 and sub_826922D0 read it without writing it (vmsum4fp128 v23,v92,v24); as local variables v92 would be
# unset there.
non_volatile_as_local = true
non_volatile_vectors_as_local = false
cr_as_local = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true

[functions]
# The functions that call setjmp keep their registers in the context (share_registers): the host longjmp returns
# into their C++ frame, and the codegen restores the context it saved at the setjmp, not local variables. The guest
# longjmp loaded r14-r31 with their values at the setjmp. None of them calls longjmp itself, so their ends (from
# .pdata) do not move.
0x821D2748 = { share_registers = true }   # libjpeg's guard
0x821D2970 = { share_registers = true }   # libpng's guards
0x821E6250 = { share_registers = true }
# Branch (b) targets that the automatic analysis did not assign to any function, reported by
# the codegen's Validate phase (UnresolvedCall). Each is a tail-call destination; declare it so
# the branch resolves to a real function.
0x82376590 = {}   # branched to from 0x823B143C
0x822215D8 = {}   # branched to from 0x8222252C
0x8246E508 = {}   # branched to from 0x823272D4, 0x823272F0
0x8221BD70 = {}   # branched to from 0x822215AC
0x8237AAD0 = {}   # branched to from 0x824037E8
0x82376620 = {}   # branched to from 0x823B166C
0x822233D0 = {}   # branched to from 0x82223794

# Alternate entry point inside sub_82213E40 (0x82213E40-0x82213ED4): the game calls 0x82213E60
# directly (fatal "unregistered function" from the smoke test), so split it out as a chunk.
0x82213E60 = { parent = 0x82213E40, end = 0x82213ED4 }

# Second thunk in sub_821967F8's range: the analyzer merged the 4-instruction tail thunk at
# 0x821967F8 (mr/mr/mr/b 0x8230F3E8) with another 4-instruction thunk at 0x82196808. The intro
# cards call 0x82196808 directly (fatal "unregistered function" at the ATVI/Neversoft cards).
0x82196808 = { parent = 0x821967F8, end = 0x82196818 }

# Function the analyzer missed between sub_82241038 (which ends exactly at 0x82241060) and
# sub_82241078. The quick-play menus call it directly (fatal "unregistered function" when
# START/Options starts a session).
0x82241060 = { end = 0x82241078 }

# The game's threads wait without spinning (src/thread_waits.cpp): four loops checked a condition again and
# again and kept a core at 100 % each (the three job workers, the main thread at the start of a frame and while
# it waits for the render thread, the render thread waiting for the vertical blank). Each hook spins briefly and then sleeps between checks;
# ghworldtour_wait_sleep_us = 0 disables them. With ghworldtour_wait_smart (on) the workers block on the job event,
# the render thread sleeps until shortly before the vertical blank, and the main thread waiting for a job group
# (sub_822AD4B8) watches the group's count between passes instead of taking the queue's lock again at once.
[[midasm_hook]]
address = 0x82413988   # li r4,0 (sub_82413928: a job worker with an empty queue, before WaitForSingleObject(event, 0))
name = "GHWorldTourJobWaitHook"
# A job queued (sub_822AD920) pulses the manual-reset job event, which woke every waiting worker for one job: with
# ghworldtour_job_wake_one the hook wakes one waiting worker itself and the pulse is skipped.
[[midasm_hook]]
address = 0x822AD148   # lis r11,-32087 (sub_822AD148: NtPulseEvent on the job event at 0x82A8B4D4)
name = "GHWorldTourJobPulseHook"
return_on_true = true
[[midasm_hook]]
address = 0x822D83F0   # cmplwi cr6,r3,0 (sub_822D8378: while (sub_8242A900(0x82CC9938) != 0) {})
name = "GHWorldTourFrameWaitHook"
registers = ["r3"]
[[midasm_hook]]
address = 0x822D4844   # cmplw cr6,r11,r10 (sub_822D4808: while (frames[24] == frames[20]) {}, waiting for the render thread)
name = "GHWorldTourRenderWaitHook"
registers = ["r11", "r10"]
[[midasm_hook]]
address = 0x8240A6B4   # cmpld cr6,r3,r11 (sub_8240A5B0: until the vertical blank counter reaches the next value)
name = "GHWorldTourVblankWaitHook"
registers = ["r3", "r11"]
[[midasm_hook]]
address = 0x8240A7FC   # cmpld cr6,r3,r30 (sub_8240A5B0: until the other counter reaches the frame's last vertical blank)
name = "GHWorldTourVblankWait2Hook"
registers = ["r3", "r30"]
# The game's two callbacks advance the counters those loops wait on: an event set right after each advance wakes the
# waiting render thread at once (src/thread_waits.cpp).
[[midasm_hook]]
address = 0x822C44C4   # lwz r10,40(r11) (sub_822C4488, the swap callback: after the swap counter 0x82A887C0's advance)
name = "GHWorldTourSwapSignalHook"
[[midasm_hook]]
address = 0x822C4474   # mftb r4 (sub_822C4440, the vertical blank callback: after the counter 0x82A887B0's advance)
name = "GHWorldTourVblankSignalHook"
[[midasm_hook]]
address = 0x822AD52C   # lwz r11,20(r29) (sub_822AD4B8: the main thread waiting for a job group, after a pass)
name = "GHWorldTourJobGroupWaitHook"
registers = ["r29", "r30"]
# The D3D library's six waits for the GPU (fences, the present, ...) call sub_821B8740 for every check.
[[midasm_hook]]
address = 0x821B8740   # mflr r12 (entry of sub_821B8740: a check of a wait for the GPU, its condition still false)
name = "GHWorldTourGpuWaitHook"

# Songs in sync with their audio (src/timer.cpp): the engine's timer replaces the 50,000,000 Hz that
# KeQueryPerformanceFrequency reports by the original console's real timebase rate, 49,875,000; the SDK's timebase
# runs at 50 MHz, so the game's clock ran 0.25 % fast and the notes drifted ahead of the audio.
# ghworldtour_timer_fix = false disables it.
[[midasm_hook]]
address = 0x822C4838   # cmplw cr6,r11,r6 (sub_822C4798: r11 = the reported frequency, r6 = 50,000,000)
name = "GHWorldTourTimerFrequencyHook"
registers = ["r6"]

# Frame rates above 60 (src/framerate.cpp, ghworldtour_frame_rate_fix): the engine's clocks counted in vertical blanks
# divide by its vertical blanks per second (the global 0x8282BD98, 60): the divisions use it times the emulated
# vblank's rate over 60, so those clocks keep their speed.
[[midasm_hook]]
address = 0x824A5CE0   # extsw r8,r30 (sub_824A5B78: a vblank clock's vblanks into seconds, r30 = vblanks per second)
name = "GHWorldTourVblankClockHook"
registers = ["r30"]
[[midasm_hook]]
address = 0x824A5F68   # extsw r11,r30 (sub_824A5B78: seconds back into vblanks, r30 = vblanks per second)
name = "GHWorldTourVblankClockHook"
registers = ["r30"]
[[midasm_hook]]
address = 0x822C45C0   # extsw r5,r10 (sub_822C45A0: the frame's vblanks into its time, r10 = vblanks per second)
name = "GHWorldTourVblankFrameTimeHook"
registers = ["r10"]
# Script waits counted in game frames ("Wait N gameframes"): above 60 Hz they last the console's N / 60 s.
[[midasm_hook]]
address = 0x82417EB8   # entry of sub_82417EB8 (a type 1 game-frame wait set: r3 = the wait, r4 = N)
name = "GHWorldTourFrameWaitSetHook"
registers = ["r3", "r4"]
[[midasm_hook]]
address = 0x82417E68   # entry of sub_82417E68 (a type 8 game-frame wait set: r3 = the wait, r4 = N)
name = "GHWorldTourFrameWaitSetHook"
registers = ["r3", "r4"]
[[midasm_hook]]
address = 0x82418210   # addi r11,r11,-1 (sub_824181B8: a game-frame wait's count above 0, r3 = the wait)
name = "GHWorldTourFrameWaitCountHook"
registers = ["r3", "r11"]
# Button presses polled by scripts (ControllerMake) last one frame: a script whose waits are held above 60 Hz is given
# the presses of the frames it skipped.
[[midasm_hook]]
address = 0x8238BD14   # bgt cr6 (sub_8238BB50: a controller's input state updated, r30 = the state, r8 = the pressed bits)
name = "GHWorldTourInputUpdateHook"
registers = ["r30", "r8"]
[[midasm_hook]]
address = 0x823E1078   # entry of sub_823E1078 (the script function ControllerMake: r4 = the script)
name = "GHWorldTourButtonPollHook"
registers = ["r4"]
[[midasm_hook]]
address = 0x823E113C   # addi r1,r1,112 (sub_823E1078's exit, every path)
name = "GHWorldTourButtonPollEndHook"
# A player's update in a song, every frame (sub_82131658, the equivalent of GH Metallica's
# sub_82137F18: it calls sub_8213AB08 first, as that one calls sub_821416A0). The hook marks the
# time so the "strum with the frets" option only strums in a song, not in the menus (src/input_gates.cpp).
[[midasm_hook]]
address = 0x82131658   # mflr r12 (sub_82131658)
name = "GHWorldTourSongFrameHook"
# The whammy on a sustain is told by the frame (the bar's movement since the previous frame, a countdown of 5 frames,
# 5 frames in a row to turn a star power sustain blue or back): above 60 Hz over a 60th of a second and 5 / 60 s.
[[midasm_hook]]
address = 0x8213CAC0   # fsubs f13,f30,f13 (sub_8213C950, a guitar: the bar's position minus the previous frame's)
name = "GHWorldTourWhammyHook"
registers = ["r30", "f30", "f13"]
[[midasm_hook]]
address = 0x8213CBBC   # fsubs f12,f30,f0 (sub_8213C950, another controller: the first axis minus the previous frame's)
name = "GHWorldTourWhammyHook"
registers = ["r30", "f30", "f0"]
[[midasm_hook]]
address = 0x8213CBD0   # fsubs f0,f29,f0 (sub_8213C950, another controller: the second axis minus the previous frame's)
name = "GHWorldTourWhammy2Hook"
registers = ["r30", "f29", "f0"]
[[midasm_hook]]
address = 0x8213F91C   # fsubs f13,f0,f13 (sub_8213F7A0, the touch strip: its position minus the previous frame's)
name = "GHWorldTourWhammyHook"
registers = ["r31", "f0", "f13"]
[[midasm_hook]]
address = 0x8213CAF0   # stwx r10,r30,r8 (sub_8213C950: the whammy countdown, 5 frames)
name = "GHWorldTourWhammyCountdownHook"
registers = ["r10"]
[[midasm_hook]]
address = 0x8213CBF0   # lfs f13,12544(r8) (sub_8213C950: r10 = 5, the countdown both axes store)
name = "GHWorldTourWhammyCountdownHook"
registers = ["r10"]
[[midasm_hook]]
address = 0x8213F948   # stwx r9,r31,r8 (sub_8213F7A0: the whammy countdown, 5 frames)
name = "GHWorldTourWhammyCountdownHook"
registers = ["r9"]
[[midasm_hook]]
address = 0x8213FB80   # cmpwi cr6,r11,5 (sub_8213F980: frames in a row of whammying)
name = "GHWorldTourWhammyStateHook"
registers = ["r11"]
[[midasm_hook]]
address = 0x8213FC5C   # cmpwi cr6,r11,5 (sub_8213F980: frames in a row of not whammying)
name = "GHWorldTourWhammyStateHook"
registers = ["r11"]
# The guitars' strings vibrate at 62 Hz, which 60 FPS shows as a 2 Hz wobble, and fade 0.99 a frame: above 60 Hz the
# wobble 60 FPS shows and the fade per 60th of a second.
[[midasm_hook]]
address = 0x8211AE14   # lis r10,-32256 (sub_8211AD88, after the call returning the strings' frequency, 62 Hz)
name = "GHWorldTourStringFrequencyHook"
registers = ["f1"]
[[midasm_hook]]
address = 0x82115C34   # lwz r11,252(r31) (sub_82115BF8, after the call returning the strings' fade, 0.99 a frame)
name = "GHWorldTourStringFadeHook"
registers = ["f1"]
# Havok's world is stepped by a fixed 1/60 s each frame (the guitars' strings swung wildly above 60 FPS): above 60 Hz by
# the frame's own time.
[[midasm_hook]]
address = 0x823A486C   # fmuls f1,f1,f31 (sub_823A4820, after lfs f31,13036(r11): the world's step, 1/60 s)
name = "GHWorldTourPhysicsStepHook"
registers = ["f31"]
# The loading screen's animations step by the frame: above 60 Hz the steps are scaled by 60 / the rate.
[[midasm_hook]]
address = 0x824B6BF0   # after lfd f31,16320(r11) (sub_824B6AB8: the boot's spinning star, f31 = its turn each frame, 0.02 radians)
name = "GHWorldTourLoadingStarHook"
registers = ["f31"]
[[midasm_hook]]
address = 0x823E55B4   # add r6,r10,r11 (sub_823E5568: DisplayLoadingScreen's icon, its angle plus its step, r10 = the step in degrees)
name = "GHWorldTourLoadingSpinnerHook"
registers = ["r10"]
[[midasm_hook]]
address = 0x824B70C0   # fadds f0,f0,f29 (sub_824B6E40's mode 2: a wave's phase plus its step, f29)
name = "GHWorldTourLoadingWaveHook"
registers = ["f29"]
[[midasm_hook]]
address = 0x824B70D0   # fadds f0,f13,f0 (sub_824B6E40's mode 2: the other phase plus its step, f0)
name = "GHWorldTourLoadingWaveHook"
registers = ["f0"]
